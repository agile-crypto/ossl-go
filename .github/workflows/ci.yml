name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  OPENSSL_VERSION: 3.5.2
  OPENSSL_PREFIX: /opt/openssl3.5.2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # OpenSSL 3.5 is newer than the runner image ships, and this package
      # needs it for ML-KEM, ML-DSA and SLH-DSA. Building it is slow, so the
      # result is cached against the version and this workflow file.
      - name: Cache OpenSSL
        id: cache-openssl
        uses: actions/cache@v4
        with:
          path: ${{ env.OPENSSL_PREFIX }}
          key: openssl-${{ env.OPENSSL_VERSION }}-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Build OpenSSL
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          set -eux
          curl -fsSLO "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz"
          tar xf "openssl-${OPENSSL_VERSION}.tar.gz"
          cd "openssl-${OPENSSL_VERSION}"
          # enable-fips builds the validated module so the FIPS tests are not
          # skipped; without it they would silently reduce coverage.
          #
          # -Wl,-rpath,... is not optional here. Without it, "openssl" and
          # libssl.so/libcrypto.so link against whatever "libssl.so.3" the
          # dynamic linker finds first -- which on this runner is the older
          # system package, not this build -- and every invocation of the
          # freshly built openssl binary fails at load time with unresolved
          # OPENSSL_3.x symbol versions. CGO_LDFLAGS gives the same rpath to
          # the Go test binaries later in scripts/ci.sh; this is the other
          # half, for the openssl CLI itself.
          ./Configure --prefix="${OPENSSL_PREFIX}" --openssldir="${OPENSSL_PREFIX}/ssl" \
            enable-fips "-Wl,-rpath,${OPENSSL_PREFIX}/lib64"
          make -j"$(nproc)"
          sudo make install_sw install_ssldirs install_fips

      - name: Install the FIPS module config
        run: sudo "${OPENSSL_PREFIX}/bin/openssl" fipsinstall
          -out "${OPENSSL_PREFIX}/ssl/fipsmodule.cnf"
          -module "${OPENSSL_PREFIX}/lib64/ossl-modules/fips.so"

      - name: Run the gate
        run: ./scripts/ci.sh
